<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Paul George — Forward Deployed Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .type { clip-path: inset(0 100% 0 0); animation: type 2.6s steps(44) 0.4s forwards; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="220" height="320" fill="url(#accent)" opacity="0.05"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- window chrome -->
    <circle cx="44" cy="40" r="6" fill="#F87171"/>
    <circle cx="64" cy="40" r="6" fill="#FBBF24"/>
    <circle cx="84" cy="40" r="6" fill="#34D399"/>
    <text x="112" y="45" class="mono" font-size="14" fill="#6B7280">~/paulhgeorge — zsh</text>

    <text x="60" y="140" class="sans" font-size="68" font-weight="800" fill="#0B0F17" letter-spacing="-1.5">Paul George</text>
    <text x="62" y="186" class="sans" font-size="24" font-weight="600" fill="url(#accent)">Forward Deployed Engineer · AI · FinTech · Security</text>

    <g class="type">
      <text x="62" y="244" class="mono" font-size="20" fill="#4B5563"><tspan fill="#0891B2">❯</tspan> shipping AI products into the real world</text>
    </g>
    <rect class="cursor" x="560" y="228" width="11" height="22" fill="#0891B2"/>

    <!-- status pill -->
    <g transform="translate(900 72)">
      <rect width="240" height="40" rx="20" fill="#FFFFFF" stroke="#D1D5DB"/>
      <circle class="pulse" cx="24" cy="20" r="6" fill="#34D399"/>
      <text x="42" y="26" class="mono" font-size="14" fill="#1F2937">FDE Intern @ Pawl</text>
    </g>
    <g transform="translate(900 124)">
      <rect width="240" height="40" rx="20" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="24" y="26" class="mono" font-size="14" fill="#1F2937">📍 Madrid · IE University</text>
    </g>
    <g transform="translate(900 176)">
      <rect width="240" height="40" rx="20" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="24" y="26" class="mono" font-size="14" fill="#1F2937">📈 CFA Level I candidate</text>
    </g>
  </g>
</svg>
